name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies and linters
        run: pip install -r requirements.txt ruff mypy
      - name: Ruff check
        run: ruff check app/ server.py entrypoints/
      - name: Ruff format check
        run: ruff format --check app/ server.py entrypoints/
      - name: Mypy
        run: mypy app/ server.py entrypoints/ --ignore-missing-imports --explicit-package-bases

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Show resolved MCP framework version
        run: python -c "import importlib.metadata as m; print('fastmcp', m.version('fastmcp'), 'mcp', m.version('mcp'))"
      - name: Run tests
        env:
          EODHD_API_KEY: test_key_for_ci
        run: python -m pytest tests/auto/ -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt bandit pip-audit
      - name: Run bandit (SAST)
        run: bandit -r app/ -ll -ii -x app/resources/
      - name: Run semgrep (SAST + taint)
        run: pipx run semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets --config p/jwt --error app/
      - name: Run pip-audit
        # pygments 2.19.2: no fix. setuptools: build-env advisories of the runner image
        # (PYSEC-2026-3447; GHSA-xmj3-9gf7-h52w is Windows-only).
        # dnspython 2.8.0 (via pydantic[email] -> email-validator; this server does no DNS
        # email checks) and filelock 4.1.0 (a dependency of pip-audit itself): the fixed
        # releases need Python >= 3.11, this job and the image run 3.10.
        env:
          IGNORED: >-
            CVE-2026-4539 PYSEC-2026-3447 GHSA-xmj3-9gf7-h52w
            CVE-2026-114605 CVE-2026-128089
            CVE-2026-112906 CVE-2026-112907 CVE-2026-112908 CVE-2026-112909 CVE-2026-112910
            CVE-2026-112911 CVE-2026-112912 CVE-2026-112913 CVE-2026-112914 CVE-2026-112915
            CVE-2026-112934 CVE-2026-112935 CVE-2026-112937 CVE-2026-112938 CVE-2026-112939
            CVE-2026-112940 CVE-2026-112941
        run: pip-audit $(printf -- '--ignore-vuln %s ' $IGNORED)
